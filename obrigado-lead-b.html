<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obrigado | Diagnóstico ARGOS | Lead B</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"></noscript>
<style>
:root{
  --ink:#0A0A0A; --card:#121212; --line:#292929;
  --fg:#FAFAFA; --muted:#A6A6A6; --muted-2:#8A8A8A;
  --blue:#1A05FF; --green:#1FEF49;
  --grad:linear-gradient(135deg,#1A05FF 0%,#1FEF49 100%);
  --r:14px; --r-sm:10px;
  --display:'Archivo','Helvetica Neue',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:var(--body);font-size:17px;line-height:1.6;color:var(--fg);background:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.08;letter-spacing:-.025em}

.fundo{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 15% 0%, rgba(26,5,255,.26), transparent 62%),
             radial-gradient(ellipse 55% 50% at 88% 100%, rgba(31,239,73,.10), transparent 62%)}
.topo{position:relative;z-index:10;display:flex;align-items:center;gap:11px;padding:20px 28px}
.topo img{height:26px;width:auto;display:block;filter:drop-shadow(0 0 14px rgba(26,5,255,.45))}
.topo span{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.topo .tag{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);padding-left:11px;border-left:1px solid var(--line)}

.palco{position:relative;z-index:10;flex:1;display:flex;align-items:center;padding:24px 28px 48px}
.tela{width:100%;max-width:620px;margin:0 auto}
.ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;margin-bottom:26px;
  background:rgba(31,239,73,.12);border:1px solid rgba(31,239,73,.42)}
.ico svg{width:28px;height:28px;fill:none;stroke:var(--green);stroke-width:2.4}
.ico.neutro{background:rgba(255,255,255,.05);border-color:var(--line)}
.ico.neutro svg{stroke:var(--muted)}
h1{font-size:clamp(28px,4.4vw,42px);margin-bottom:16px;max-width:20ch}
.txt{font-size:17px;font-weight:300;color:var(--muted);max-width:56ch;margin-bottom:14px}
.txt b{color:var(--fg);font-weight:500}

.passos{list-style:none;display:grid;gap:12px;margin:28px 0 30px;max-width:54ch;
  padding:24px 26px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.passos li{display:flex;gap:14px;align-items:flex-start;font-size:15.5px;font-weight:300;
  color:var(--muted);line-height:1.5}
.passos li b{display:block;color:var(--fg);font-weight:500;margin-bottom:2px;font-size:15px}
.passos .n{flex-shrink:0;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--green);
  border:1px solid rgba(31,239,73,.35);border-radius:6px;padding:3px 7px;margin-top:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:11px;
  font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;
  padding:19px 30px;border-radius:12px;border:0;cursor:pointer;
  background:#25D366;color:#062B14;box-shadow:0 16px 40px -14px rgba(37,211,102,.65);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease}
.btn:hover{transform:translateY(-3px);box-shadow:0 22px 52px -14px rgba(37,211,102,.8)}
.btn svg{width:19px;height:19px;fill:currentColor}
.nota{margin-top:14px;font-size:12.5px;color:var(--muted-2);line-height:1.55}
.voltar{display:inline-block;margin-top:22px;font-family:var(--mono);font-size:12px;
  letter-spacing:.06em;color:var(--muted-2);text-decoration:underline}
.voltar:hover{color:var(--green)}

@media (max-width:640px){
  body{font-size:16px}
  .topo{padding:16px 18px} .topo .tag{display:none}
  .palco{padding:14px 18px 34px;align-items:flex-start}
  h1{font-size:27px}
  .passos{padding:20px 18px;margin:22px 0 24px}
  .btn{width:100%;font-size:14px;padding:17px 20px}
}
</style>
</head>
<body>

<div class="fundo" aria-hidden="true"></div>

<header class="topo">
  <a href="index.html" style="display:flex;align-items:center;gap:11px">
    <img src="assets/argos-mark.png" alt="" width="223" height="420">
    <span>Argos</span>
  </a>
  <div class="tag">Marketing orientado a negócios</div>
</header>

<main class="palco">
  <div class="tela" id="tela"></div>
</main>

<script>
(function(){
'use strict';

/* ==========================================================================
   META — cole o ID do pixel aqui. Vazio = nada e disparado.
   ========================================================================== */
var PIXEL_ID = '';

var WHATS  = '557131801402';
var ORIGEM = 'Diagnóstico ARGOS · Geral';

/* Esta pagina existe so para o Lead B. Uma URL por grau permite
   criar uma conversao personalizada por URL no Meta e otimizar para o
   grau que interessa. Quem escolhe o destino e o formulario. */
var G = 'B';

/* ------------------------------------------------------------------ dados */
var r = {}, rota = 'ok';
try {
  var salvo = JSON.parse(localStorage.getItem('argos_diag_v1') || 'null');
  if (salvo && salvo.r) r = salvo.r;
  if (salvo && salvo.rota) rota = salvo.rota;
} catch(e){}

/* ------------------------------------------------------------------ meta */
/* Dispara uma vez so: recarregar a pagina nao pode contar lead de novo. */
function jaDisparou(){
  try { return localStorage.getItem('argos_pixel_v1') === (r.email || '1') + G; } catch(e){ return false; }
}
function marcarDisparo(){
  try { localStorage.setItem('argos_pixel_v1', (r.email || '1') + G); } catch(e){}
}

if (PIXEL_ID && !jaDisparou()){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
  (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');
  fbq('track', 'Lead', {
    content_name: 'Lead ' + G,
    content_category: ORIGEM,
    lead_grade: G,
    faturamento: r.faturamento || '',
    prioridade: r.prioridade || '',
    segmento: r.segmento || '',
    resultado: rota
  });
  marcarDisparo();
}

/* dataLayer tambem, para quem preferir disparar pelo GTM */
window.dataLayer = window.dataLayer || [];
window.dataLayer.push({
  event: 'lead_qualificado', lead_grade: G, origem: ORIGEM,
  faturamento: r.faturamento || '', prioridade: r.prioridade || '', resultado: rota
});

/* ------------------------------------------------------------- conteudo */
var TEXTOS = {
  ok: { icone:'', titulo:'Recebemos suas respostas.', txt:'Sua empresa tem o perfil do Método VQC. Um especialista da ARGOS já está com o seu cenário de aquisição em mãos.' },
  cedo: { icone:'neutro', titulo:'Recebemos, e vamos ser diretos com você.', txt:'Com o faturamento que você informou, a verba que sobra para mídia normalmente não gera volume suficiente para a etapa de qualificação funcionar. <b>Preferimos dizer isso agora a te vender um resultado que não viria.</b>' },
  conhecendo: { icone:'neutro', titulo:'Perfeito. Sem pressa.', txt:'Você marcou que está conhecendo possibilidades, então não vamos te perseguir. <b>Quem decide o ritmo é você.</b>' }
};
var t = TEXTOS[rota] || TEXTOS.ok;

var ROTULOS = { nome:'Nome', email:'E-mail', whatsapp:'WhatsApp', segmento:'Segmento',
                faturamento:'Faturamento', prioridade:'Prioridade' };
var msg = 'Olá! Acabei de preencher o formulário da ARGOS e gostaria de antecipar a fila.\n\n';
for (var k in ROTULOS) if (r[k]) msg += ROTULOS[k] + ': ' + r[k] + '\n';
var linkWa = 'https://wa.me/' + WHATS + '?text=' + encodeURIComponent(msg);

var okIco  = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>';
var neuIco = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16"/></svg>';

document.getElementById('tela').innerHTML =
  '<div class="ico ' + t.icone + '">' + (t.icone ? neuIco : okIco) + '</div>' +
  '<h1>' + t.titulo + '</h1>' +
  '<p class="txt">' + t.txt + '</p>' +
  '<ul class="passos">' +
    '<li><span class="n">01</span><span><b>Ligação em menos de 1 minuto</b>' +
      'Nossa equipe liga para o número que você informou, ainda agora.</span></li>' +
    '<li><span class="n">02</span><span><b>Diagnóstico pelo WhatsApp</b>Em até 1 dia útil, com os gargalos que encontramos entre o primeiro clique e a oportunidade.</span></li>' +
  '</ul>' +
  '<a class="btn" href="' + linkWa + '" target="_blank" rel="noopener">' +
    '<svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47 0 1.45 1.06 2.86 1.21 3.06.15.2 2.09 3.2 5.08 4.48.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.8h-.02c-1.75 0-3.47-.47-4.97-1.36l-.36-.21-3.7.97.99-3.6-.23-.37a9.83 9.83 0 01-1.5-5.25c0-5.44 4.44-9.87 9.9-9.87 2.64 0 5.12 1.03 6.99 2.9a9.8 9.8 0 012.89 6.98c0 5.44-4.44 9.87-9.89 9.87M20.52 3.45A11.75 11.75 0 0012.05.02C5.5.02.17 5.34.17 11.88c0 2.09.55 4.13 1.59 5.93L.07 24l6.34-1.66a11.9 11.9 0 005.64 1.43h.01c6.55 0 11.88-5.32 11.88-11.86 0-3.17-1.24-6.15-3.48-8.39"/></svg>' +
    'Gostaria de antecipar a fila' +
  '</a>' +
  '<p class="nota">Você vai para o WhatsApp com as suas respostas já preenchidas.</p>' +
  '<a class="voltar" href="index.html">voltar para o site</a>';

})();
</script>
</body>
</html>
